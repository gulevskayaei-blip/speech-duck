<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>🦆 Pixel Duck Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Press Start 2P', monospace;
    overflow: hidden;
    height: 100vh;
    background: #5C94FC;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
  }

  #teacherScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    background: #5C94FC;
  }
  #teacherScreen h1 {
    color: white;
    font-size: 28px;
    margin-bottom: 30px;
    text-shadow: 4px 4px 0 #000;
    text-align: center;
    line-height: 1.5;
  }
  #teacherScreen .pixel-duck {
    font-size: 100px;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
  }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-15px);} }
  
  #teacherScreen textarea {
    width: 90%; max-width: 700px; height: 200px;
    padding: 15px; font-size: 14px;
    border: 4px solid #000;
    background: white;
    font-family: 'Press Start 2P', monospace;
    resize: none;
  }
  
  .pixel-btn {
    margin-top: 20px; padding: 18px 30px;
    font-size: 16px;
    background: #E52521;
    color: white;
    border: 4px solid #000;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    box-shadow: 0 6px 0 #000;
    transition: all 0.1s;
    text-transform: uppercase;
  }
  .pixel-btn:hover { background: #FF3B30; }
  .pixel-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
  .pixel-btn.green { background: #00A850; }
  .pixel-btn.green:hover { background: #00C853; }
  
  #teacherScreen p {
    color: white; margin-top: 20px; font-size: 10px;
    background: #000; padding: 12px 20px;
    border: 3px solid white;
    text-align: center; max-width: 600px; line-height: 1.8;
  }

  #gameScreen { display: none; position: relative; height: 100vh; overflow: hidden; background: #5C94FC; }

  .sky { position: absolute; top: 0; left: 0; width: 100%; height: 65%; background: #5C94FC; }
  .sun { position: absolute; top: 30px; right: 60px; width: 60px; height: 60px; background: #FFD800; border: 4px solid #000; }

  .cloud { position: absolute; background: white; border: 3px solid #000; animation: cloudMove 25s linear infinite; }
  .cloud1 { width: 80px; height: 30px; top: 50px; }
  .cloud1::before { content:''; position:absolute; width:40px; height:40px; background:white; border:3px solid #000; top:-25px; left:10px; }
  .cloud1::after { content:''; position:absolute; width:30px; height:30px; background:white; border:3px solid #000; top:-18px; right:10px; }
  .cloud2 { width: 60px; height: 25px; top: 100px; animation: cloudMove 35s linear infinite; animation-delay: -10s; }
  .cloud2::before { content:''; position:absolute; width:30px; height:30px; background:white; border:3px solid #000; top:-18px; left:8px; }
  .cloud3 { width: 100px; height: 35px; top: 150px; animation: cloudMove 30s linear infinite; animation-delay: -20s; }
  .cloud3::before { content:''; position:absolute; width:45px; height:45px; background:white; border:3px solid #000; top:-28px; left:15px; }
  @keyframes cloudMove { from{left:110%;} to{left:-200px;} }

  .hill { position: absolute; bottom: 35%; background: #00A850; border: 4px solid #000; border-radius: 100px 100px 0 0 / 80px 80px 0 0; }
  .hill1 { left: 10%; width: 200px; height: 100px; }
  .hill2 { left: 60%; width: 150px; height: 70px; }

  .ground {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 35%;
    background: repeating-linear-gradient(90deg, #C84C0C 0 40px, #000 40px 44px),
                repeating-linear-gradient(0deg, #C84C0C 0 20px, #000 20px 24px), #C84C0C;
    background-blend-mode: multiply;
    border-top: 4px solid #000;
  }

  .road { position: absolute; bottom: 35%; left: 0; width: 100%; height: 60px; background: #E59400; border-top: 4px solid #000; border-bottom: 4px solid #000; }
  .road-lines { position: absolute; top: 50%; left: 0; width: 200%; height: 8px; background: repeating-linear-gradient(90deg, #FFF 0 30px, transparent 30px 60px); transform: translateY(-50%); animation: roadMove 1s linear infinite; }
  @keyframes roadMove { from{transform:translateY(-50%) translateX(0);} to{transform:translateY(-50%) translateX(-60px);} }

  #gameContainer { position: absolute; bottom: calc(35% + 60px); left: 0; width: 100%; height: 200px; pointer-events: none; }

  #duck { position: absolute; bottom: 0; left: 15%; width: 96px; height: 96px; z-index: 10; image-rendering: pixelated; }
  #duck.jumping { animation: jump 0.7s ease-out; }
  #duck.crash { animation: crash 1.2s ease-in; }
  @keyframes jump {
    0% { transform: translateY(0) rotate(0deg); }
    40% { transform: translateY(-150px) rotate(-10deg); }
    60% { transform: translateY(-150px) rotate(5deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }
  @keyframes crash {
    0% { transform: translateY(0) rotate(0deg); }
    20% { transform: translateY(-30px) rotate(-30deg); }
    40% { transform: translateY(20px) rotate(60deg); }
    60% { transform: translateY(-10px) rotate(180deg); }
    80% { transform: translateY(10px) rotate(300deg); }
    100% { transform: translateY(0) rotate(360deg); }
  }

  #duck.running .leg-left { animation: legRunLeft 0.3s linear infinite; transform-origin: top center; }
  #duck.running .leg-right { animation: legRunRight 0.3s linear infinite; transform-origin: top center; }
  #duck.running .wing { animation: wingFlap 0.4s ease-in-out infinite; transform-origin: center; }
  @keyframes legRunLeft { 0%,100%{transform:rotate(-25deg);} 50%{transform:rotate(25deg);} }
  @keyframes legRunRight { 0%,100%{transform:rotate(25deg);} 50%{transform:rotate(-25deg);} }
  @keyframes wingFlap { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(15deg);} }

  .eye-lid { animation: blink 3s infinite; transform-origin: center; }
  @keyframes blink { 0%,95%,100%{transform:scaleY(0);} 97%{transform:scaleY(1);} }

  .obstacle { position: absolute; bottom: 0; font-size: 70px; animation: obstacleMove 4s linear forwards; z-index: 15; }
  @keyframes obstacleMove { from { left: 110%; } to { left: -100px; } }

  .pit { position: absolute; bottom: -10px; width: 100px; height: 30px; background: #000; border: 3px solid #333; animation: pitMove 4s linear forwards; z-index: 15; }
  @keyframes pitMove { from { left: 110%; } to { left: -150px; } }

  #textArea {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    width: 92%; max-width: 900px; background: rgba(255,255,255,0.97);
    padding: 25px; border: 4px solid #000; box-shadow: 8px 8px 0 #000;
    font-size: 22px; line-height: 1.8; text-align: center;
    max-height: 35vh; overflow-y: auto; z-index: 50;
    font-family: 'Press Start 2P', monospace;
  }
  .word { display: inline-block; margin: 0 3px; padding: 3px 7px; transition: all 0.3s; }
  .word.current { background: #FFD800; color: #000; transform: scale(1.2); border: 3px solid #000; font-weight: bold; }
  .word.correct { background: #00A850; color: white; border: 3px solid #000; }
  .word.wrong { background: #E52521; color: white; border: 3px solid #000; animation: shake 0.5s; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

  #score { position: absolute; top: 20px; right: 20px; background: #FFD800; padding: 12px 25px; font-size: 18px; font-weight: bold; border: 4px solid #000; box-shadow: 4px 4px 0 #000; z-index: 60; font-family: 'Press Start 2P', monospace; }

  /* Кнопка включения микрофона */
  #micButton {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    padding: 20px 40px;
    font-size: 14px;
    background: #E52521;
    color: white;
    border: 4px solid #000;
    cursor: pointer;
    font-family: 'Press Start 2P', monospace;
    box-shadow: 0 6px 0 #000;
    z-index: 70;
    text-transform: uppercase;
    animation: pulseBtn 1.5s infinite;
  }
  @keyframes pulseBtn {
    0%,100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }
  #micButton.active {
    background: #00A850;
    animation: none;
  }

  /* Что услышал микрофон */
  #heardText {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: #FFD800;
    padding: 10px 20px;
    border: 3px solid #FFD800;
    font-size: 12px;
    z-index: 65;
    font-family: 'Press Start 2P', monospace;
    min-width: 200px;
    text-align: center;
    display: none;
  }

  #micStatus {
    position: absolute;
    bottom: 15px; left: 15px;
    background: #000;
    color: white;
    padding: 10px 15px;
    font-size: 10px;
    display: flex; align-items: center; gap: 10px;
    border: 3px solid white;
    z-index: 60;
    font-family: 'Press Start 2P', monospace;
  }
  .mic-dot { width: 12px; height: 12px; background: #E52521; }
  .mic-dot.active { background: #00A850; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  #flashOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; pointer-events: none; z-index: 100; }
  #flashOverlay.active { animation: flash 0.5s; }
  @keyframes flash { 0%,100% { opacity: 0; } 50% { opacity: 0.4; } }

  #finishScreen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; color: white; text-align: center; }
  #finishScreen h1 { font-size: 40px; margin-bottom: 20px; text-shadow: 4px 4px 0 #000; }
  #finishScreen .big-duck { font-size: 120px; animation: bounce 1s infinite; }
  #finishScreen p { font-size: 20px; margin-bottom: 30px; }
</style>
</head>
<body>

<div id="teacherScreen">
  <div class="pixel-duck">🦆</div>
  <h1>PIXEL DUCK<br>READING</h1>
  <textarea id="textinput" placeholder="Введите текст...">Мама мыла раму. Папа читал газету. Катя играла с кошкой. На улице светило солнце.</textarea>
  <button class="pixel-btn" onclick="startLesson()">START</button>
  <p>Откройте в Chrome или Edge.<br>Адрес сайта должен начинаться с HTTPS</p>
</div>

<div id="gameScreen">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="hill hill1"></div>
  <div class="hill hill2"></div>
  <div class="ground"></div>
  <div class="road"><div class="road-lines"></div></div>

  <div id="score">SCORE: 0</div>

  <div id="gameContainer">
    <svg id="duck" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="40" width="40" height="30" fill="#FFD800" stroke="#000" stroke-width="2"/>
      <rect x="25" y="45" width="20" height="15" fill="#FFD800" stroke="#000" stroke-width="2" class="wing"/>
      <rect x="55" y="25" width="25" height="25" fill="#FFD800" stroke="#000" stroke-width="2"/>
      <rect x="75" y="30" width="15" height="8" fill="#FF6B00" stroke="#000" stroke-width="2"/>
      <rect x="65" y="30" width="6" height="6" fill="#FFF"/>
      <rect x="67" y="32" width="3" height="3" fill="#000"/>
      <ellipse class="eye-lid" cx="68" cy="33" rx="3" ry="3" fill="#FFD800"/>
      <rect x="35" y="70" width="6" height="15" fill="#FF6B00" stroke="#000" stroke-width="2" class="leg-left"/>
      <rect x="55" y="70" width="6" height="15" fill="#FF6B00" stroke="#000" stroke-width="2" class="leg-right"/>
      <rect x="20" y="45" width="10" height="8" fill="#FFD800" stroke="#000" stroke-width="2"/>
    </svg>
  </div>

  <div id="textArea"></div>

  <!-- ЧТО УСЛЫШАЛ МИКРОФОН -->
  <div id="heardText">🎤 ...</div>

  <!-- КНОПКА ВКЛЮЧЕНИЯ МИКРОФОНА -->
  <button id="micButton" onclick="toggleMic()">🎤 ВКЛЮЧИТЬ МИКРОФОН</button>

  <div id="micStatus">
    <div class="mic-dot" id="micDot"></div>
    <span id="micText">МИКРОФОН ВЫКЛ</span>
  </div>

  <div id="flashOverlay"></div>
</div>

<div id="finishScreen">
  <div class="big-duck">🦆</div>
  <h1>GAME OVER!</h1>
  <p id="finalScore">SCORE: 0</p>
  <button class="pixel-btn green" onclick="location.reload()">RESTART</button>
</div>

<script>
let words = [];
let currentWordIndex = 0;
let score = 0;
let recognition = null;
let isListening = false;
let obstacleInterval = null;
let isJumping = false;
let isCrashing = false;
let micStarted = false;

function startLesson() {
  const text = document.getElementById('textinput').value.trim();
  if (!text) { alert('Введите текст!'); return; }

  words = text.split(/\s+/).filter(w => w.length > 0);
  currentWordIndex = 0;
  score = 0;

  renderWords();
  document.getElementById('teacherScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';

  startObstacles();
}

function renderWords() {
  const area = document.getElementById('textArea');
  area.innerHTML = words.map((w, i) => {
    let cls = 'word';
    if (i < currentWordIndex) cls += ' correct';
    else if (i === currentWordIndex) cls += ' current';
    return `<span class="${cls}" data-index="${i}">${w}</span>`;
  }).join(' ');

  const current = area.querySelector('.word.current');
  if (current) current.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// КНОПКА ВКЛЮЧЕНИЯ МИКРОФОНА
function toggleMic() {
  if (!micStarted) {
    startRecognition();
  } else {
    stopRecognition();
  }
}

function startRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    alert('❌ Браузер не поддерживает распознавание речи!\n\nОткройте страницу в Google Chrome или Microsoft Edge.');
    return;
  }

  try {
    recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      console.log('✅ Микрофон включен');
      isListening = true;
      micStarted = true;
      
      const btn = document.getElementById('micButton');
      btn.textContent = '🔴 ВЫКЛЮЧИТЬ МИКРОФОН';
      btn.classList.add('active');
      
      document.getElementById('micDot').classList.add('active');
      document.getElementById('micText').textContent = 'СЛУШАЮ...';
      document.getElementById('heardText').style.display = 'block';
    };

    recognition.onresult = (event) => {
      // Берем САМЫЙ ПОСЛЕДНИЙ результат
      const lastIndex = event.results.length - 1;
      const result = event.results[lastIndex];
      let transcript = result[0].transcript.trim();
      
      // Показываем что услышали
      document.getElementById('heardText').textContent = '🎤 ' + transcript;
      console.log('🎤 Услышано:', transcript, '| Final:', result.isFinal);
      
      // Обрабатываем ТОЛЬКО финальные результаты (полные слова)
      if (result.isFinal) {
        processSpeech(transcript);
      }
    };

    recognition.onerror = (e) => {
      console.error('❌ Ошибка микрофона:', e.error);
      
      if (e.error === 'not-allowed') {
        alert('❌ Доступ к микрофону запрещён!\n\n1. Нажмите на значок 🔒 слева от адреса сайта\n2. Найдите "Микрофон"\n3. Выберите "Разрешить"\n4. Обновите страницу (F5)');
        stopRecognition();
      } else if (e.error === 'no-speech') {
        console.log('Тишина...');
      } else if (e.error === 'network') {
        alert('❌ Ошибка сети. Проверьте интернет.');
      } else {
        console.log('Ошибка:', e.error);
      }
    };

    recognition.onend = () => {
      console.log('🔄 Recognition ended');
      // Автоматически перезапускаем, если мы всё ещё слушаем
      if (isListening && micStarted) {
        try { 
          setTimeout(() => {
            if (isListening && micStarted) recognition.start();
          }, 100);
        } catch(e) {
          console.log('Не удалось перезапустить:', e);
        }
      }
    };

    // ЗАПУСКАЕМ!
    recognition.start();
    console.log('🎤 Запуск распознавания...');
    
  } catch(e) {
    console.error('Критическая ошибка:', e);
    alert('❌ Не удалось запустить микрофон: ' + e.message);
  }
}

function stopRecognition() {
  isListening = false;
  micStarted = false;
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
    recognition = null;
  }
  
  const btn = document.getElementById('micButton');
  btn.textContent = '🎤 ВКЛЮЧИТЬ МИКРОФОН';
  btn.classList.remove('active');
  
  document.getElementById('micDot').classList.remove('active');
  document.getElementById('micText').textContent = 'МИКРОФОН ВЫКЛ';
  document.getElementById('heardText').style.display = 'none';
}

function processSpeech(text) {
  if (currentWordIndex >= words.length || isCrashing) return;

  // Очищаем от знаков препинания
  const cleanText = text.toLowerCase().replace(/[.,!?;:"'()-]/g, '').trim();
  const spokenWords = cleanText.split(/\s+/).filter(w => w.length > 0);
  
  if (spokenWords.length === 0) return;

  // Берём ПОСЛЕДНЕЕ сказанное слово
  const spoken = spokenWords[spokenWords.length - 1];
  const expected = words[currentWordIndex].toLowerCase().replace(/[.,!?;:"'()-]/g, '');

  console.log(`🧠 Сравнение: "${spoken}" vs "${expected}"`);

  if (spoken === expected) {
    onCorrect();
  } else if (spoken.length > 1) {
    // Реагируем только если это полноценное слово
    onWrong();
  }
}

function onCorrect() {
  if (isJumping) return;
  score += 10;
  document.getElementById('score').textContent = 'SCORE: ' + score;

  const duck = document.getElementById('duck');
  isJumping = true;
  duck.classList.add('running');
  duck.classList.remove('jumping');
  void duck.offsetWidth;
  duck.classList.add('jumping');
  setTimeout(() => { 
    duck.classList.remove('jumping'); 
    isJumping = false;
    // Останавливаем бег через 1 секунду после приземления
    setTimeout(() => { duck.classList.remove('running'); }, 500);
  }, 700);

  currentWordIndex++;
  renderWords();

  if (currentWordIndex >= words.length) finishLesson();
}

function onWrong() {
  if (isCrashing) return;
  isCrashing = true;

  const flash = document.getElementById('flashOverlay');
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');

  const current = document.querySelector('.word.current');
  if (current) {
    current.classList.add('wrong');
    setTimeout(() => current.classList.remove('wrong'), 600);
  }

  const duck = document.getElementById('duck');
  duck.classList.remove('running');
  duck.classList.remove('crash');
  void duck.offsetWidth;
  duck.classList.add('crash');

  setTimeout(() => {
    duck.classList.remove('crash');
    isCrashing = false;
  }, 1200);
}

function startObstacles() {
  obstacleInterval = setInterval(() => {
    const rand = Math.random();
    if (rand < 0.25) {
      const pit = document.createElement('div');
      pit.className = 'pit';
      document.getElementById('gameContainer').appendChild(pit);
      setTimeout(() => pit.remove(), 4000);
    } else {
      const obs = document.createElement('div');
      obs.className = 'obstacle';
      const obstacles = ['🌵', '💩', '🚧'];
      obs.textContent = obstacles[Math.floor(Math.random() * obstacles.length)];
      document.getElementById('gameContainer').appendChild(obs);
      setTimeout(() => obs.remove(), 4000);
    }
  }, 2500);
}

function finishLesson() {
  stopRecognition();
  clearInterval(obstacleInterval);

  document.getElementById('finalScore').textContent = 'SCORE: ' + score;
  document.getElementById('finishScreen').style.display = 'flex';
}
</script>
</body>
</html>
